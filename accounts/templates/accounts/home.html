{% extends "accounts/base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Home</h1>
    {% if user.is_authenticated %}
        <p>You are logged in as {{ user.username }}.</p>
    {% else %}
        <p>You are not logged in. <a href="{% url 'login' %}">Login</a> or <a href="{% url 'register' %}">register</a>.</p>
    {% endif %}
{% endblock %}
